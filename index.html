<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter Professional | Labs Studio Art</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        h1 { margin-bottom: 10px; color: #38bdf8; }
        textarea { width: 100%; height: 400px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 14px; resize: vertical; }
        .controls { margin: 20px 0; display: flex; gap: 10px; }
        button { padding: 12px 24px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-format { background: #38bdf8; color: #0f172a; }
        .btn-format:hover { background: #7dd3fc; }
        .btn-clear { background: #475569; color: white; }
        .error { color: #f43f5e; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>JSON Formatter & Validator</h1>
        <p>Formatação instantânea e profissional para os teus dados.</p>
        
        <textarea id="jsonInput" placeholder="Cola aqui o teu código JSON..."></textarea>
        
        <div class="controls">
            <button class="btn-format" onclick="formatJSON()">Formatar JSON</button>
            <button class="btn-clear" onclick="clearAll()">Limpar</button>
        </div>
        
        <div id="errorMessage" class="error"></div>
    </div>

    <script>
        function formatJSON() {
            const input = document.getElementById('jsonInput').value;
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerText = '';
            
            try {
                const parsed = JSON.parse(input);
                document.getElementById('jsonInput').value = JSON.stringify(parsed, null, 4);
            } catch (e) {
                errorDiv.innerText = 'Erro no JSON: ' + e.message;
            }
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('errorMessage').innerText = '';
        }
    </script>
</body>
</html>
