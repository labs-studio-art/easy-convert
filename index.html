<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional JSON Formatter | Validate & Format Online</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 950px; background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #334155; }
        h1 { margin-top: 0; color: var(--primary); font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        textarea { width: 100%; height: 400px; background: #0f172a; color: #7dd3fc; border: 1px solid #475569; border-radius: 10px; padding: 20px; font-family: 'Courier New', monospace; font-size: 14px; box-sizing: border-box; }
        .controls { display: flex; gap: 12px; margin-top: 20px; }
        button { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-format { background: var(--primary); color: #0f172a; }
        .btn-format:hover { background: #7dd3fc; }
        .btn-download { background: #10b981; color: white; }
        .btn-clear { background: #ef4444; color: white; }
        footer { margin-top: 40px; font-size: 12px; color: #64748b; text-align: center; border-top: 1px solid #334155; padding-top: 20px; }
        footer a { color: #94a3b8; text-decoration: none; margin: 0 10px; }
        footer a:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>JSON Formatter & Validator</h1>
        <p>Clean, format, and validate your JSON data instantly.</p>
        
        <textarea id="jsonInput" placeholder="Paste your raw JSON code here..."></textarea>
        
        <div class="controls">
            <button class="btn-format" onclick="formatJSON()">Format JSON</button>
            <button class="btn-download" onclick="downloadJSON()">Download .json</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
        <div id="msg" style="margin-top: 15px; font-weight: 500;"></div>
    </div>

    <footer>
        <p>© 2026 JSON Formatter Pro. All rights reserved.</p>
        <p>
            <a href="mailto:support@jsonformatterpro.com">Contact Support</a> | 
            <a href="#">Privacy Policy</a> | 
            <a href="#">Terms of Service</a>
        </p>
    </footer>

    <script>
        function formatJSON() {
            const input = document.getElementById('jsonInput');
            const msg = document.getElementById('msg');
            try {
                const parsed = JSON.parse(input.value);
                input.value = JSON.stringify(parsed, null, 4);
                msg.innerHTML = '<span style="color:#10b981">✓ JSON formatted successfully!</span>';
            } catch (e) {
                msg.innerHTML = '<span style="color:#ef4444">⚠ Error: ' + e.message + '</span>';
            }
        }
        function downloadJSON() {
            const data = document.getElementById('jsonInput').value;
            if(!data) return;
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'formatted.json'; a.click();
        }
        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('msg').innerHTML = '';
        }
    </script>
</body>
</html>
